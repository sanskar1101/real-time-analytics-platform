[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "real-time-analysis-backend"
version = "0.1.0"
description = "FastAPI backend for the Real-Time Analytics Platform"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "celery>=5.3.0",
    "fastapi>=0.110.0",
    "passlib>=1.7.4",
    "pydantic>=2.6.0",
    "python-json-logger>=2.0.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.0",
    "reportlab>=4.0.0",
    "SQLAlchemy>=2.0.25",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # do not perform function calls in default args (FastAPI Depends pattern)
    "UP007",  # use X | Y for union types (conflicts with from __future__ import annotations)
    "SIM102", # use single if instead of nested (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── Black ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
