[project]
name = "real-time-analysis-backend"
version = "0.1.0"
description = "FastAPI backend for the Real-Time Analytics Platform"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "celery>=5.3.0",
    "fastapi>=0.110.0",
    "passlib>=1.7.4",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.0",
    "SQLAlchemy>=2.0.25",
    "uvicorn[standard]>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
