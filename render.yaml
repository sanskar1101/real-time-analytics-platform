databases:
  - name: real-time-analysis-db
    databaseName: analytics_db
    user: analytics_user
    plan: free
    region: oregon

services:
  # ── Web API ────────────────────────────────────────────────────────────────
  - type: web
    name: real-time-analysis-api
    env: python
    region: oregon
    plan: free
    rootDir: apps/backend
    buildCommand: pip install -e .
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: real-time-analysis-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 30
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false

  # ── Celery Worker ──────────────────────────────────────────────────────────
  - type: worker
    name: real-time-analysis-worker
    env: python
    region: oregon
    plan: free
    rootDir: apps/backend
    buildCommand: pip install -e .
    startCommand: celery -A src.core.celery_app worker -l info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: real-time-analysis-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        fromService:
          type: web
          name: real-time-analysis-api
          envVarKey: SECRET_KEY
      - key: ENVIRONMENT
        value: production

  # ── Celery Beat ────────────────────────────────────────────────────────────
  - type: worker
    name: real-time-analysis-beat
    env: python
    region: oregon
    plan: free
    rootDir: apps/backend
    buildCommand: pip install -e .
    startCommand: celery -A src.core.celery_app beat -l info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: real-time-analysis-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        fromService:
          type: web
          name: real-time-analysis-api
          envVarKey: SECRET_KEY
      - key: ENVIRONMENT
        value: production
